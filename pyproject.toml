[project]
name = "gemma3-sd-pure-ella"
version = "0.1.0"
description = "Pure ELLA-style Gemma→Stable Diffusion training with timestep-aware connector"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "diffusers>=0.28.0",
    "transformers>=4.45.0",
    "accelerate>=0.26.0",
    "datasets>=2.16.0",
    "torchvision>=0.16.0",
    "wandb>=0.16.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "torchmetrics[image]>=1.3.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
]

[tool.uv]
dev-dependencies = []

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
